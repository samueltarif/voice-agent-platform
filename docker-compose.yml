services:
  postgres:
    image: postgres:16-alpine
    container_name: voice-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-voice_agent_dev}
    ports:
      # Publicado SOMENTE em loopback: a guarda dos testes 008-OF2 exige essa evidência.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-voice_agent_dev}']
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: voice_agent_postgres_data
